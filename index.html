<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="eyebrow">Static Starter</p>
        <h1>Hello World</h1>
        <p class="lead" id="message">
          A tiny static website that is ready to expand into something bigger.
        </p>

        <div class="actions">
          <button type="button" id="hello-button">Say hello</button>
        </div>

        <dl class="meta">
          <div>
            <dt>Status</dt>
            <dd>Working</dd>
          </div>
          <div>
            <dt>Mode</dt>
            <dd>Static HTML/CSS/JS</dd>
          </div>
          <div>
            <dt>Updated</dt>
            <dd id="timestamp">Just now</dd>
          </div>
        </dl>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
